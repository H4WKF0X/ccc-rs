# Contest settings (committed). Machine-wide settings (e.g. credentials) go in ~/.config/ccc/config.toml,
# personal overrides for this repo in ccc.local.toml (git-ignored). Later files win; empty values don't.

# Set by new-contest.sh.
name = "template"
game_slug = ""

# "codingcontest": login/fetch/progress/submit talk to codingcontest.org (login read from Firefox).
# "manual": you download/upload in the browser and `submit` just lists the files.
platform = "codingcontest"

# The <name> in the portal URL codingcontest.org/contests/<name>/game. Usually unnecessary: without it
# the client uses your running contest registration, else your active training run.
contest = ""

# Judge levels with many valid answers by the game's own sandbox checker (checker/README.md). Only
# applies to levels that ship a sandbox-level-N.html, and only once it accepts the official example
# answer; if it can't run, you get a warning, never a block. Set to "" to turn it off.
checker = "node checker/sandbox-check.js {sandbox} {input} {output}"

# Output line endings: "auto" copies the example output; "crlf" or "lf" force one.
line_ending = "auto"

# Where `cargo ccc ingest` without arguments looks for the newest level zip (default ~/Downloads).
# downloads_dir = "/path/to/Downloads"
