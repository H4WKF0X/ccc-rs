[package]
# Unique per contest repo (new-contest sets it), as are the harness package and the binary name.
name = "solution-template"
description = "This contest's solvers: one src/levels/level<N>.rs per level."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
harness = { path = "../harness", package = "harness-template" }

[[bin]]
name = "ccc-template"
path = "src/main.rs"
